name: CI - Test, Build and Run Docker

on:
  push:
    branches: [ main, add-ci-docker ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest --cov=.

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t flask-ci-docker .

    - name: Run Docker container in background
      run: docker run -d -p 5000:5000 --name testcontainer flask-ci-docker

    - name: Wait for container to start
      run: sleep 10

    - name: Test Docker container response
      run: curl http://localhost:5000

    - name: Stop and remove container
      run: |
        docker stop testcontainer
        docker rm testcontainer
